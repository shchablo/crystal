[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal"
version = "0.5.0"
requires-python = ">=3.7"
authors = [
    {name = "Shchablo Konstantin", email = "shchablo@gmail.com"},
    {name = "Zhukova Elizaveta", email = "zhukova@mail.ru"},
]
description = "Calculation of Rates, Yield, and Stability of Avalanches in Locations"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["Avalanches"]

dependencies = [
    "scipy==1.15.1",
    "pandas==2.2.3",
    "numpy==1.23.5",
    "PyYAML==6.0.2"
]

[project.scripts]
crystal = "srcs.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.unittest]
test_paths = ["tests"]